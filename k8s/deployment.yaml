apiVersion: apps/v1
kind: Deployment
metadata:
  name: myservice
  labels:
    app: myservice
spec:
  replicas: 2               # CẤU HÌNH QUAN TRỌNG: Chạy 2 Pods song song
  selector:
    matchLabels:
      app: myservice
  template:
    metadata:
      labels:
        app: myservice
      annotations:          # Cấu hình cho Prometheus thu thập dữ liệu
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "3000"
    spec:
      containers:
      - name: myservice
        image: docker.io/minhquyen1325/nt533group2:1.0.0
        imagePullPolicy: Always  # Luôn tải image mới nhất khi update
        ports:
        - containerPort: 3000
        # Cấu hình kiểm tra sức khỏe Pod
        readinessProbe:
          httpGet:
            path: /
            port: 3000
        livenessProbe:
          httpGet:
            path: /
            port: 3000